name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck + lint + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      # These jobs never launch Electron; skipping the ~100 MB binary download
      # keeps CI fast. Packaging jobs (step 26) do download it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests
        run: npm test

      - name: Checkpoint extension package
        run: npm run build:extension && npm run verify:extension

      # Coverage thresholds are enforced on one OS (the numbers are the same on
      # all three; this keeps the matrix fast) — plan step 25.
      - name: Coverage thresholds
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Office manifest is in sync
        run: npm run office:manifest:check

  e2e:
    name: e2e smoke (windows)
    runs-on: windows-latest
    # This job launches Electron, so it must NOT inherit the checks job's
    # ELECTRON_SKIP_BINARY_DOWNLOAD=1 — the Electron binary is the app under
    # test.
    env:
      # Playwright drives Electron, not its own bundled browsers.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The full E2E suite: shell smoke, the startup budget, and the
      # deterministic-fake-provider flows (session, settings, persistence, web
      # tab) — plan step 25. `e2e:smoke`/`e2e:perf` are the tagged subsets.
      - name: End-to-end (Playwright + Electron)
        run: npm run test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  site:
    name: site gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci --prefix site

      - name: Format the site
        run: npm --prefix site run format:check

      - name: Typecheck, sync and unit test the site
        run: npm run site:check

      - name: Build the site and check every link
        run: npm run site:build
