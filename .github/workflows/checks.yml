name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck + lint + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      # These jobs never launch Electron; skipping the ~100 MB binary download
      # keeps CI fast. Packaging jobs (step 26) do download it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # `npm ci` can leave node-pty without a binary (npm 12 blocks install
      # scripts without `allowScripts`; Linux has no prebuild). Fail here, with
      # the loader error, instead of at first terminal use.
      - name: Native terminal module
        run: node scripts/check-native-terminal.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The real-PTY integration test skips when the host bundle is absent, so
      # build it and require the test: a terminal path that nobody ran is what
      # shipped broken in 0.8.0.
      - name: Build the terminal host bundle
        run: npm run build:host

      - name: Unit + integration tests
        env:
          PI_REQUIRE_TERMINAL_HOST: "1"
        run: npm test

      # The release compiles node-pty in a pinned Debian 11 container. Exercise
      # that script on every PR so a broken image or Dockerfile-only assumption
      # fails here, not on a tag.
      - name: Pinned Linux node-pty build
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          npm run runtime:fetch -- --platform linux-x64
          npm run pty:linux -- --arch x64 --force
          npm run pty:linux -- --check-only --arch x64

      - name: Checkpoint extension package
        run: npm run build:extension && npm run verify:extension

      # Coverage thresholds are enforced on one OS (the numbers are the same on
      # all three; this keeps the matrix fast) — plan step 25.
      - name: Coverage thresholds
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Office manifest is in sync
        run: npm run office:manifest:check

  e2e:
    name: e2e smoke (windows)
    runs-on: windows-latest
    # This job launches Electron, so it must NOT inherit the checks job's
    # ELECTRON_SKIP_BINARY_DOWNLOAD=1 — the Electron binary is the app under
    # test.
    env:
      # Playwright drives Electron, not its own bundled browsers.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The full E2E suite: shell smoke, the startup budget, and the
      # deterministic-fake-provider flows (session, settings, persistence, web
      # tab) — plan step 25. `e2e:smoke`/`e2e:perf` are the tagged subsets.
      - name: End-to-end (Playwright + Electron)
        run: npm run test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  site:
    name: site gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci --prefix site

      - name: Format the site
        run: npm --prefix site run format:check

      - name: Typecheck, sync and unit test the site
        run: npm run site:check

      - name: Build the site and check every link
        run: npm run site:build
