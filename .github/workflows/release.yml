name: release

# Cuts a public, cross-platform release from a `v*` tag.
#
# The repository is public, so every standard GitHub-hosted runner (macOS
# included) is free, and Release assets are downloadable without a token -
# which is also what lets `electron-updater` read the feed.
#
# Shape, and why it is shaped like this:
#
#   prepare  creates the Release as a DRAFT and decides whether this run
#            publishes at all (tag push = yes, dispatch = opt-in).
#   windows  \
#   linux     > each job builds on its own OS and uploads its installers
#   macos    /  *and* its `latest*.yml` manifests straight to that draft.
#               No artifact hop: installers are ~200 MB each and the draft is
#               invisible to end users, so a partial upload is never served.
#   publish  flips the draft to published + latest only when all three builds
#            succeeded, then re-reads the feed anonymously to prove it works.
#
# `workflow_dispatch` with `publish: false` is the dry run: same builds, same
# verifications, artifacts uploaded for inspection, nothing published.
#
# Actions are pinned to the commit behind their major tag: this workflow holds
# `contents: write` and publishes what everyone downloads.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (default: v<package.json version>)"
        type: string
        default: ""
      publish:
        description: "Publish the draft once all three platforms pass"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # `afterPack` turns this into `resources/build-info.json`; a `release` build
  # is the only kind that runs automatic update checks.
  PI_BUILD_CHANNEL: release

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # No npm cache here: a cached tree feeding a release is the one place a
      # poisoned cache would reach installed apps.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.22.2

      - name: Resolve the tag and the publish decision
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="$INPUT_TAG"
          [ -n "$tag" ] || tag="v$version"
          # A tag push must describe the version it points at; a dispatch may
          # deliberately build an older tag, so it is not checked.
          if [ "$EVENT_NAME" = "push" ] && [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json v$version"
            exit 1
          fi
          test -f "docs/releases/$tag.md" || {
            echo "::error::missing docs/releases/$tag.md"
            exit 1
          }
          publish=false
          if [ "$EVENT_NAME" = "push" ] || [ "$INPUT_PUBLISH" = "true" ]; then
            publish=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release $tag publish=$publish" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the draft release
        if: steps.resolve.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          retry_create() {
            local attempts=3 delay=10 n=1 status
            while true; do
              if gh release view "$TAG" >/dev/null 2>&1; then return 0; fi
              if gh release create "$TAG" \
                --draft \
                --verify-tag \
                --title "Pi Desktop $TAG" \
                --notes-file "docs/releases/$TAG.md"; then
                return 0
              fi
              status=$?
              if [ "$n" -ge "$attempts" ]; then return "$status"; fi
              echo "release create attempt $n/$attempts failed" \
                "(exit $status); retrying in ${delay}s" >&2
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }
          retry_create
          echo "draft release: $TAG"

  windows:
    name: windows (${{ needs.prepare.outputs.version }})
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # upload to the draft release
    defaults:
      run:
        # The runner default is PowerShell, where `set -euo pipefail` is a
        # syntax error. Git Bash is preinstalled and lets all three jobs share
        # one shell dialect.
        shell: bash
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      npm_config_fetch_retries: "5"
      npm_config_fetch_retry_mintimeout: "20000"
      npm_config_fetch_retry_maxtimeout: "120000"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.22.2

      # Verified upstream archives only: electron-builder checks its tool
      # checksums, and the Electron zip is validated against a fresh
      # SHASUMS256.txt. `node_modules` and npm's cache are deliberately absent.
      - name: Restore the release download caches
        id: build-cache
        # v4
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-release-v1-${{
            hashFiles('package-lock.json', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-v1-

      - name: Install
        run: bash scripts/retry.sh 3 30 -- npm ci

      # Fetches the win32-x64 runtime, builds, regenerates the host shims, runs
      # `runtime:verify`, then NSIS + portable (+ `latest.yml`, blockmap).
      - name: Build
        run: npm run build

      - name: Fetch the bundled runtime
        run: npm run runtime:fetch -- --platform win32-x64

      - name: Verify the bundled runtime
        run: npm run runtime:verify

      # Windows used to run all of the above in one step. Splitting it means a
      # retry never rebuilds the app or refetches Node.
      - name: Package (retry on transient downloads)
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          DEBUG: "@electron/get:*"
        run: |
          bash scripts/package-retry.sh npx electron-builder \
            --win --x64 --publish never \
            -c.electronDownload.cache="$ELECTRON_CACHE"

      - name: Inspect the failed package attempt
        if: failure()
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: |
          set -uo pipefail
          echo "--- cache sizes"
          du -sh "$ELECTRON_CACHE" "$ELECTRON_BUILDER_CACHE" 2>/dev/null || true
          echo "--- release tree"
          find release -maxdepth 2 2>/dev/null || true

      - name: Verify the artefacts
        run: |
          set -euo pipefail
          ls -l release
          node scripts/release-assets.mjs \
            --platform win --dir release --version "$VERSION"
          runtimes="$(ls release/win-unpacked/resources/runtime/node)"
          echo "bundled runtime(s): $runtimes"
          test "$(printf '%s\n' "$runtimes" | wc -l)" -eq 1
          test "$runtimes" = "win32-x64"
          res=release/win-unpacked/resources
          test -f "$res/app-update.yml"
          grep -q "provider: github" "$res/app-update.yml"
          grep -q '"channel": "release"' "$res/build-info.json"
          grep -q "\"version\": \"$VERSION\"" "$res/build-info.json"

      - name: Open a real PTY from the packaged app
        run: |
          app=release/win-unpacked
          node scripts/verify-packaged-terminal.mjs --dir "$app"

      - name: Upload to the draft release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/retry.sh 3 15 -- gh release upload "$TAG" \
            release/*.exe release/*.blockmap release/latest.yml \
            --clobber

      - name: Keep the artefacts (dry run)
        if: needs.prepare.outputs.publish != 'true'
        # Pinned to v4's commit.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-${{ needs.prepare.outputs.version }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Save the release download caches
        if: >-
          success() && steps.build-cache.outputs.cache-hit != 'true' &&
          steps.build-cache.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  linux:
    name: linux-${{ matrix.arch }} (${{ needs.prepare.outputs.version }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            runtime: linux-x64
          # node-pty ships no Linux prebuild: both Linux jobs compile it, and
          # arm64 must compile on an arm64 runner rather than a cross toolchain.
          # Both runners are pinned: `ubuntu-latest` moved to a 26.04-era image
          # (glibc 2.42) and broke every older distribution in v0.8.0.
          - arch: arm64
            runner: ubuntu-24.04-arm
            runtime: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      npm_config_fetch_retries: "5"
      npm_config_fetch_retry_mintimeout: "20000"
      npm_config_fetch_retry_maxtimeout: "120000"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.22.2

      # Verified upstream archives only: electron-builder checks its tool
      # checksums, and the Electron zip is validated against a fresh
      # SHASUMS256.txt. `node_modules` and npm's cache are deliberately absent.
      - name: Restore the release download caches
        id: build-cache
        # v4
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-release-v1-${{
            hashFiles('package-lock.json', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-v1-

      - name: Install
        run: bash scripts/retry.sh 3 30 -- npm ci

      - name: Build
        run: npm run build

      # Fetch order matters: `runtime:fetch` writes `resources/runtime/bin` for
      # the *last* `--platform` it was given, and `runtime:verify` executes that
      # shim. Foreign arm64 first (no shims), host x64 last.
      - name: Fetch the bundled runtimes
        run: |
          set -euo pipefail
          npm run runtime:fetch -- --platform ${{ matrix.runtime }}

      - name: Verify the bundled runtime
        run: npm run runtime:verify

      # node-pty must be built against the oldest supported glibc, not the
      # runner's. The image is resolved to a digest first so the provenance in
      # `BUILD-INFO.json` names exactly what compiled the binary.
      - name: Resolve the pinned node-pty build image
        run: |
          set -euo pipefail
          docker pull debian:bullseye
          digest="$(docker image inspect \
            --format '{{index .RepoDigests 0}}' debian:bullseye)"
          echo "PI_PTY_IMAGE=$digest" >> "$GITHUB_ENV"

      - name: Build the Linux node-pty (glibc floor)
        run: |
          set -euo pipefail
          npm run pty:linux -- --arch ${{ matrix.arch }}
          npm run pty:linux -- --check-only --arch ${{ matrix.arch }}

      - name: Package (retry on transient downloads)
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          DEBUG: "@electron/get:*"
        run: |
          bash scripts/package-retry.sh npx electron-builder \
            --linux --${{ matrix.arch }} --publish never \
            -c.electronDownload.cache="$ELECTRON_CACHE"

      - name: Inspect the failed package attempt
        if: failure()
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: |
          set -uo pipefail
          echo "--- cache sizes"
          du -sh "$ELECTRON_CACHE" "$ELECTRON_BUILDER_CACHE" 2>/dev/null || true
          echo "--- release tree"
          find release -maxdepth 2 2>/dev/null || true

      - name: Verify the artefacts
        run: |
          set -euo pipefail
          ls -l release
          node scripts/release-assets.mjs \
            --platform linux --arch ${{ matrix.arch }} \
            --dir release --version "$VERSION"
          for deb in release/*.deb; do
            echo "--- $deb"
            dpkg-deb -I "$deb" |
              grep -E '^ (Package|Version|Architecture|Maintainer|Depends)'
            # `dpkg-deb -c` prints thousands of lines. Piping that into
            # `grep -q` makes `printf` die of SIGPIPE once grep exits on the
            # first match, and `pipefail` turns that into an exit 1 — a real
            # failure on the runner, not a missing entry. Write the listing to
            # a file and grep the file.
            entries_file="$(mktemp)"
            dpkg-deb -c "$deb" > "$entries_file"
            # The Pi host runtime must ship outside the asar.
            node_re='resources/runtime/node/linux-[a-z0-9]+/bin/node$'
            grep -qE "$node_re" "$entries_file"
            # `afterPack` prunes to the package's own arch: a two-arch run must
            # not leak the other architecture's Node into a package.
            runtime_re='resources/runtime/node/linux-[a-z0-9]+/'
            runtimes="$(grep -oE "$runtime_re" "$entries_file" | sort -u)"
            test -n "$runtimes"
            test "$runtimes" = "resources/runtime/node/${{ matrix.runtime }}/"
            echo "bundled runtime: $runtimes"
            host_bundle='resources/app.asar.unpacked/out/host/index.mjs'
            grep -q "$host_bundle" "$entries_file"
            # The native backend is the pinned prebuild (never a runner build),
            # and the terminal host bundle travels with it.
            pty_dir='resources/app.asar.unpacked/node_modules/node-pty'
            runtime='${{ matrix.runtime }}'
            pty_node="$pty_dir/prebuilds/$runtime/pty.node"
            grep -q "$pty_node" "$entries_file"
            if grep -q "$pty_dir/build/Release/pty.node" "$entries_file"; then
              echo "::error::the package ships an unpinned node-pty build" >&2
              exit 1
            fi
            host_out='resources/app.asar.unpacked/out/host'
            grep -q "$host_out/terminal.mjs" "$entries_file"
            grep -q 'usr/share/applications/pi-desktop.desktop' "$entries_file"
            rm -f "$entries_file"
          done
          for appimage in release/*.AppImage; do
            echo "--- $appimage"
            magic="$(head -c 4 "$appimage" | od -An -tx1 | tr -d ' \n')"
            test "$magic" = "7f454c46"
            # A packaged app is ~200 MB; a truncated one is the classic
            # failure.
            test "$(stat -c %s "$appimage")" -gt 150000000
          done
          echo "artefacts verified"

      # A binary that exists and passes the floor check can still fail to load.
      # This opens a real PTY through the packaged host, the packaged node-pty
      # and the bundled Node — then repeats it inside Debian 11 (glibc 2.31),
      # which is the oldest runtime the package claims to support.
      - name: Open a real PTY from the packaged app
        run: |
          set -euo pipefail
          # electron-builder names the default arch `linux-unpacked` and any
          # other `linux-<arch>-unpacked`, so the matrix cannot hard-code one.
          app_dir="$(find release -maxdepth 1 -type d -name 'linux*-unpacked' \
            | head -n 1)"
          test -n "$app_dir"
          node scripts/verify-packaged-terminal.mjs --dir "$app_dir"

          deb_dir="$(mktemp -d)"
          dpkg-deb -x release/*.deb "$deb_dir"
          deb_resources="$(find "$deb_dir" -maxdepth 4 \
            -type d -path '*/resources' | head -n 1)"
          test -n "$deb_resources"
          node scripts/verify-packaged-terminal.mjs --resources "$deb_resources"

          appimage_dir="$(mktemp -d)"
          (cd "$appimage_dir" && "$GITHUB_WORKSPACE"/release/*.AppImage \
            --appimage-extract >/dev/null)
          app_resources="$appimage_dir/squashfs-root/resources"
          node scripts/verify-packaged-terminal.mjs --resources "$app_resources"

          verify_script="$GITHUB_WORKSPACE/scripts/verify-packaged-terminal.mjs"
          runtime='${{ matrix.runtime }}'
          docker run --rm \
            -v "$verify_script:/verify.mjs:ro" \
            -v "$appimage_dir/squashfs-root:/app:ro" \
            -w / \
            debian:bullseye \
            "/app/resources/runtime/node/$runtime/bin/node" /verify.mjs \
              --resources /app/resources \
              --node "/app/resources/runtime/node/$runtime/bin/node" \
              --shell /bin/sh --cwd /

      - name: Upload to the draft release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/retry.sh 3 15 -- gh release upload "$TAG" \
            release/*.AppImage release/*.deb release/latest-linux*.yml \
            --clobber

      - name: Keep the artefacts (dry run)
        if: needs.prepare.outputs.publish != 'true'
        # Pinned to v4's commit.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux*.yml
          if-no-files-found: error

      - name: Save the release download caches
        if: >-
          success() && steps.build-cache.outputs.cache-hit != 'true' &&
          steps.build-cache.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  macos:
    name: macos (${{ needs.prepare.outputs.version }})
    needs: prepare
    # `macos-latest` is the arm64 image (3-core M1). Both arches are packaged in
    # one run: electron-builder downloads the x64 Electron distribution itself.
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      # No Apple Developer identity exists yet (backlog). Never look for one in
      # the keychain, and tell `afterPack` what the package will be signed
      # with: ad-hoc is enough for the kernel on arm64, but Squirrel.Mac
      # rejects an update built with it - hence "manual updates" on macOS.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PI_MAC_SIGNING: adhoc
      npm_config_fetch_retries: "5"
      npm_config_fetch_retry_mintimeout: "20000"
      npm_config_fetch_retry_maxtimeout: "120000"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.22.2

      # Verified upstream archives only: electron-builder checks its tool
      # checksums, and the Electron zip is validated against a fresh
      # SHASUMS256.txt. `node_modules` and npm's cache are deliberately absent.
      - name: Restore the release download caches
        id: build-cache
        # v4
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-release-v1-${{
            hashFiles('package-lock.json', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-v1-

      - name: Install
        run: bash scripts/retry.sh 3 30 -- npm ci

      - name: Build
        run: npm run build

      # Same ordering rule as linux: foreign x64 first without shims, host arm64
      # last so `resources/runtime/bin` points at a runtime this host can run.
      - name: Fetch the bundled runtimes
        run: |
          set -euo pipefail
          npm run runtime:fetch -- --platform darwin-x64 --skip-shims
          npm run runtime:fetch -- --platform darwin-arm64

      - name: Verify the bundled runtime
        run: npm run runtime:verify

      - name: Package (retry on transient downloads)
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          DEBUG: "@electron/get:*"
        run: |
          bash scripts/package-retry.sh npx electron-builder \
            --mac --arm64 --x64 --publish never \
            -c.mac.identity=- \
            -c.electronDownload.cache="$ELECTRON_CACHE"

      - name: Inspect the failed package attempt
        if: failure()
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: |
          set -uo pipefail
          echo "--- cache sizes"
          du -sh "$ELECTRON_CACHE" "$ELECTRON_BUILDER_CACHE" 2>/dev/null || true
          echo "--- release tree"
          find release -maxdepth 2 2>/dev/null || true

      - name: Verify the bundles
        run: |
          set -euo pipefail
          ls -l release
          node scripts/release-assets.mjs \
            --platform mac --dir release --version "$VERSION"
          # electron-builder names the x64 bundle `mac` and the arm64 one
          # `mac-arm64`; only the *artefacts* carry the `-x64` suffix. Looking
          # for `release/mac-x64` fails with "no such directory".
          for entry in "arm64:mac-arm64" "x64:mac"; do
            arch="${entry%%:*}"
            app="release/${entry#*:}/Pi Desktop.app"
            echo "--- $app ($arch)"
            test -d "$app"
            # Ad-hoc signing is still a real signature: this must pass, and it
            # fails if electron-builder skipped signing entirely.
            codesign --verify --deep --strict --verbose=2 "$app"
            # Not notarized, so Gatekeeper rejects it - but "damaged" would
            # mean an invalid signature (what an unsigned arm64 app shows).
            spctl_out="$(spctl -vv --assess "$app" 2>&1 || true)"
            printf '%s\n' "$spctl_out"
            grep -q "rejected" <<<"$spctl_out"
            if grep -qi "damaged" <<<"$spctl_out"; then
              echo "::error::$app reports 'damaged'; signature is invalid"
              exit 1
            fi
            info="$app/Contents/Resources/build-info.json"
            grep -q '"channel": "release"' "$info"
            grep -q '"macSigning": "adhoc"' "$info"
            grep -q "\"version\": \"$VERSION\"" "$info"
          done
          # The packaged shims and the bundled node must run inside the bundle:
          # this is what proves `app.asar.unpacked` paths survive packaging.
          app="release/mac-arm64/Pi Desktop.app"
          test -f "$app/Contents/Resources/runtime/bin/pi"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" \
            "$app/Contents/Resources/runtime/bin/pi" --version
          env -i PATH=/usr/bin:/bin \
            "$app/Contents/Resources/runtime/node/darwin-arm64/bin/node" \
            --version
          # Record what the single mac manifest lists; the dry run decides
          # whether one arch needs a follow-up merge (see the docs).
          if grep -q '\-arm64\.zip' release/latest-mac.yml &&
            grep -q '\-x64\.zip' release/latest-mac.yml; then
            echo "latest-mac.yml lists both arches" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::latest-mac.yml does not list both arches"
            echo "latest-mac.yml is missing an arch" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "### latest-mac.yml"
            echo '```yaml'
            cat release/latest-mac.yml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The packaged terminal, with the real node-pty prebuild for each arch.
      - name: Open a real PTY from the packaged app
        run: |
          set -euo pipefail
          arm_app='release/mac-arm64/Pi Desktop.app'
          x64_app='release/mac/Pi Desktop.app'
          # node-pty execs this helper and reports only
          # `posix_spawnp failed`, so print the evidence that decides the case:
          # presence, mode and signature.
          for arch in arm64 x64; do
            if [ "$arch" = arm64 ]; then app="$arm_app"; else app="$x64_app"; fi
            subtree="$app/Contents/Resources/app.asar.unpacked/node_modules/node-pty"
            helper="$subtree/prebuilds/darwin-$arch/spawn-helper"
            echo "--- spawn-helper ($arch)"
            ls -l "$helper" || true
            file "$helper" || true
            codesign -dv --verbose=2 "$helper" 2>&1 | head -5 || true
            # The packaged copy must carry the idempotent helper-path rewrite:
            # without it macOS resolves app.asar.unpacked.unpacked.
            grep -q 'Pi Desktop: node-pty@1.1.0 rewrote app.asar' \
              "$subtree/lib/unixTerminal.js"
          done
          node scripts/verify-packaged-terminal.mjs \
            --resources "$arm_app/Contents/Resources" --arch arm64
          # The runner is arm64, so the x64 bundle needs Rosetta, which a hosted
          # runner may not have. Exercise it when it can run; otherwise record
          # the skip instead of failing a package that is fine.
          if arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            # Rosetta's first translation of a large x64 binary is slow, so the
            # x64 pass gets a longer budget than the native one.
            x64_runtime="$x64_app/Contents/Resources/runtime/node"
            arch -x86_64 "$x64_runtime/darwin-x64/bin/node" --version
            node scripts/verify-packaged-terminal.mjs \
              --resources "$x64_app/Contents/Resources" --arch x64 \
              --timeout 180000
          else
            echo "::warning::Rosetta is unavailable; x64 PTY smoke skipped"
            echo "x64 PTY smoke skipped (no Rosetta); helper, mode, signature" \
              "and the packaged patch were asserted" >> "$GITHUB_STEP_SUMMARY"
          fi

      # A mac runner may lack a GUI session, so this is evidence, not a gate.
      - name: Launch smoke (arm64)
        continue-on-error: true
        run: |
          set -uo pipefail
          app="release/mac-arm64/Pi Desktop.app"
          "$app/Contents/MacOS/Pi Desktop" > /tmp/launch.log 2>&1 &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" || true
            echo "launch smoke: alive after 15 s" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "launch smoke: exited early" >> "$GITHUB_STEP_SUMMARY"
            tail -40 /tmp/launch.log || true
            exit 1
          fi

      - name: Upload to the draft release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/retry.sh 3 15 -- gh release upload "$TAG" \
            release/*.dmg release/*.zip release/latest-mac.yml \
            --clobber

      - name: Keep the artefacts (dry run)
        if: needs.prepare.outputs.publish != 'true'
        # Pinned to v4's commit.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-${{ needs.prepare.outputs.version }}
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error

      - name: Save the release download caches
        if: >-
          success() && steps.build-cache.outputs.cache-hit != 'true' &&
          steps.build-cache.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  publish:
    name: publish
    needs: [prepare, windows, linux, macos]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      # This job deliberately has no `actions/checkout` (it only flips the
      # release and curls the public feed), so `gh` has no git remote to infer
      # {owner}/{repo} from and dies with "fatal: not a git repository".
      GH_REPO: ${{ github.repository }}
    steps:
      # The draft is what makes the feed atomic: `electron-updater` cannot see
      # a draft, so the first moment the feed exists it is already complete.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry() {
            local attempts="$1" delay="$2"
            shift 2
            local n=1 status
            while true; do
              if "$@"; then return 0; fi
              status=$?
              if [ "$n" -ge "$attempts" ]; then return "$status"; fi
              echo "attempt $n/$attempts failed (exit $status);" \
                "retrying in ${delay}s" >&2
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }
          retry 3 15 gh release edit "$TAG" --draft=false --latest

      # Proves the two things only the public internet can prove: the manifests
      # are readable without a token, and the installers they name are there.
      - name: Verify the public feed anonymously
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          base="https://github.com/$repo/releases/download/$TAG"
          manifests="latest.yml latest-linux.yml"
          manifests="$manifests latest-linux-arm64.yml latest-mac.yml"
          for manifest in $manifests; do
            for attempt in 1 2 3 4 5; do
              if body="$(curl -fsSL --max-time 60 --connect-timeout 15 \
                "$base/$manifest")"; then break; fi
              echo "waiting for $manifest ($attempt)"
              sleep 5
              body=""
            done
            test -n "$body"
            printf '%s' "$body" | grep -q "^version: $VERSION$"
            echo "feed: $manifest -> $VERSION"
          done
          for asset in \
            "Pi-Desktop-$VERSION-win-x64-setup.exe" \
            "Pi-Desktop-$VERSION-linux-x86_64-appimage.AppImage" \
            "Pi-Desktop-$VERSION-mac-arm64.dmg"; do
            code=""
            for attempt in 1 2 3 4 5; do
              code="$(curl -s -o /dev/null -w '%{http_code}' \
                -L -r 0-0 --max-time 60 --connect-timeout 15 \
                "$base/$asset" || true)"
              if [ "$code" = "206" ] || [ "$code" = "200" ]; then break; fi
              echo "waiting for $asset ($attempt)"
              sleep 5
            done
            echo "asset: $asset -> HTTP $code"
            test "$code" = "206" || test "$code" = "200"
          done
          {
            echo "### Published $TAG"
            echo "Feed verified anonymously for all four manifests."
          } >> "$GITHUB_STEP_SUMMARY"
