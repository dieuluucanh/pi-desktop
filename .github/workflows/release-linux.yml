name: release-linux

# Builds the Linux beta artefacts (`AppImage` + `.deb`, x64 and arm64) on a real
# Linux host, which is the only way to package Linux targets the way this repo
# intends them: electron-builder stamps `/opt` paths, a `.desktop` entry and a
# deb control file that are only exercised properly on the platform itself.
#
# Manual on purpose. `checks.yml` already runs the gates on every push; this
# workflow downloads Electron, two Node runtimes and the fpm/AppImage toolsets,
# and it can attach files to a GitHub Release — none of which should happen
# without a human choosing to cut a build.
#
#   Actions → release-linux → Run workflow
#     create_release: false   (default)  → artefacts land in the run's Artifacts
#     create_release: true               → a *draft* GitHub Release is created
#                                          with the artefacts attached
#
# Creating the release as a draft is deliberate: the plan's step-27 acceptance
# matrix (clean install, first session) has not been run for Linux, so nothing
# here publishes a live update feed for it. `docs/releases/v0.1.0.md` is the
# honest state and stays that way until the matrix passes.

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a draft GitHub Release with the artefacts"
        type: boolean
        default: false
      tag:
        description: "Release tag (defaults to v<package.json version>)"
        type: string
        default: ""
      arch:
        description: "Target architectures"
        type: choice
        options: ["x64,arm64", "x64"]
        default: "x64,arm64"

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: linux ${{ inputs.arch }} (AppImage + deb)
    runs-on: ubuntu-latest
    permissions:
      contents: write # only for the release steps, which are gated below
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # No ELECTRON_SKIP_BINARY_DOWNLOAD here: electron-builder needs the
      # Electron distribution for the target arch (for arm64 it fetches the
      # arm64 build of the same Electron version).
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The bundled Pi host runtime. `--platform` works from any host (the
      # script verifies a foreign runtime statically instead of executing it),
      # so the x64 runner can also prepare the arm64 runtime for the arm64
      # artefacts — plan step 26.
      - name: Fetch the bundled runtimes
        run: |
          npm run runtime:fetch -- --platform linux-x64 --skip-shims
          case "${{ inputs.arch }}" in
            *arm64*)
              npm run runtime:fetch -- --platform linux-arm64 --skip-shims
              ;;
          esac

      # Proves the runtime this build will ship actually runs, with PATH
      # stripped to the shims — the acceptance check `package:linux` also runs.
      - name: Verify the bundled runtime
        run: npm run runtime:verify

      - name: Package
        run: |
          args="--linux"
          case "${{ inputs.arch }}" in
            *arm64*) args="$args --x64 --arm64" ;;
            *) args="$args --x64" ;;
          esac
          npx electron-builder $args --publish never

      # Packaging that "succeeds" while silently dropping a resource is the
      # failure mode worth catching: these assertions read the finished
      # artefacts rather than the build config.
      - name: Verify the artefacts
        run: |
          set -euo pipefail
          ls -l release
          for deb in release/*.deb; do
            echo "--- $deb"
            dpkg-deb -I "$deb" \
              | grep -E '^ (Package|Version|Architecture|Maintainer|Depends)'
            # The Pi host runtime must be inside, outside the asar.
            dpkg-deb -c "$deb" \
              | grep -qE 'resources/runtime/node/linux-[a-z0-9]+/bin/node$'
            dpkg-deb -c "$deb" \
              | grep -q 'resources/app.asar.unpacked/out/host/index.mjs'
            dpkg-deb -c "$deb" \
              | grep -q 'usr/share/applications/pi-desktop.desktop'
          done
          for appimage in release/*.AppImage; do
            echo "--- $appimage"
            magic="$(head -c 4 "$appimage" | od -An -tx1 | tr -d ' \n')"
            test "$magic" = "7f454c46"
            # A packaged app is ~300 MB; a truncated one is the classic failure.
            test "$(stat -c %s "$appimage")" -gt 200000000
          done
          echo "artefacts verified"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers-${{ github.run_number }}
          path: |
            release/*.deb
            release/*.AppImage
            release/latest-linux.yml
          if-no-files-found: error

      # Draft only, and only when asked. `gh` is preinstalled on the runner, so
      # this needs no third-party release action.
      - name: Create the draft release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="v$version"
          {
            echo "Pi Desktop $tag — Linux beta artefacts (AppImage + .deb)."
            echo
            echo "Unsigned, and not yet installed on a real Linux machine: see"
            echo "docs/releases/v${version}.md for the known limitations."
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/*.deb release/*.AppImage --clobber
          else
            gh release create "$tag" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Pi Desktop $tag (Linux beta)" \
              --notes-file notes.md \
              release/*.deb release/*.AppImage
          fi
          echo "draft release: $tag"
