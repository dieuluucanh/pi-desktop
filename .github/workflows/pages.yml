name: pages

# Deploys the public site to GitHub Pages.
#
# The release process merges the version bump and `docs/releases/<tag>.md` to
# `main` before it pushes the tag, so a `main` push already contains the release
# content. There is deliberately no `release: published` trigger: the release
# workflow publishes with the repository `GITHUB_TOKEN`, and GitHub suppresses
# workflow runs for events generated by that token.
#
# One-time setup: Settings -> Pages -> Source = GitHub Actions. The
# `configure-pages` enablement fallback is attempted on the first run; if the
# repository policy forbids it, flip the setting manually and re-run.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci --prefix site

      - name: Check the site
        run: npm run site:check

      - name: Build the site
        run: npm run site:build

      # v6
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: true

      # v5
      - name: Upload Pages artifact
        uses: >-
          actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/dist

  deploy:
    name: deploy site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
