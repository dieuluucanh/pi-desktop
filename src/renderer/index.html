<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The Content Security Policy is injected at build time by the
      `pi-desktop-renderer-csp` plugin in `electron.vite.config.ts`: production
      gets the strict `RENDERER_CSP`, the dev server gets a policy that allows
      Vite's inline refresh preamble. `tests/architecture/security.test.ts` pins
      that this file has no inline script and carries the placeholder.
    -->
    <meta http-equiv="Content-Security-Policy" content="__PI_RENDERER_CSP__" />
    <title>Pi Desktop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
